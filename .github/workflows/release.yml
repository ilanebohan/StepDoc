name: Release

# main only receives releases: every push there releases the version written in the POM.
# The procedure is in docs/releasing.md.
on:
  push:
    branches: [main]

permissions:
  contents: read

# Never two releases at once, and never cancel one that is uploading.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to Maven Central
    # A fork has neither the secrets nor the right to publish.
    if: github.repository == 'ilanebohan/StepDoc'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The signing key and the Central token live in this environment, restricted to main.
    environment: maven-central
    permissions:
      contents: write # creates the tag and the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency cache here: a release is built from what Maven Central serves today.
      # server-* writes a settings.xml that reads the Central token from the environment.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD

      - name: Read the version to release
        id: version
        shell: bash
        run: |
          version=$(./mvnw -q -ntp help:evaluate -Dexpression=project.version -DforceStdout | tail -n 1)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::main holds version '$version': a release needs a plain x.y.z version (see docs/releasing.md)."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "::error::Version $version is already released: the tag v$version exists."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # deploy runs the whole build again (tests, coverage floors, Javadoc). The release profile
      # then signs every artifact and uploads the bundle. Central validates it, but nothing is
      # public until the maintainer publishes the deployment from the Portal.
      - name: Build, sign and upload
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: ./mvnw -B -ntp -Prelease deploy

      - name: Create the tag and the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Release notes: the section of this version in the changelog.
          awk -v heading="## [$VERSION]" '
            /^## \[/ { printing = index($0, heading) == 1; next }
            printing { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "StepDoc $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
