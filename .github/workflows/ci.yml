name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

# A newer push on the same branch or PR makes the running build pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-name:
    name: Branch name
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check branch naming rules
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
        run: |
          # main only receives releases from develop
          if [ "$BASE" = "main" ]; then
            [ "$HEAD" = "develop" ] && exit 0
            echo "::error::Only develop can be merged into main (got '$HEAD')."
            exit 1
          fi
          # develop receives <github-user>/<type>/<issue> branches and Dependabot updates
          if [[ "$HEAD" =~ ^[A-Za-z0-9-]+/(feature|fix|tech|docs|test)/[a-z0-9._-]+$ ]] \
             || [[ "$HEAD" == dependabot/* ]]; then
            exit 0
          fi
          echo "::error::Branch '$HEAD' must be named <github-user>/<type>/<issue>, type being feature, fix, tech, docs or test."
          exit 1

  build:
    name: Build (JDK ${{ matrix.java }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 17 is the minimum supported version, 21 and 25 the current LTS users run.
        os: [ubuntu-latest]
        java: ['17', '21', '25']
        # Paths and line endings differ on Windows: one job there catches it.
        include:
          - os: windows-latest
            java: '17'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and run unit tests
        run: ${{ runner.os == 'Windows' && '.\mvnw.cmd' || './mvnw' }} -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-jdk${{ matrix.java }}-${{ matrix.os }}
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore

  plugin-smoke-test:
    name: Plugin smoke test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install the plugin locally
        run: ./mvnw -B -ntp install -DskipTests

      # The example contains a deliberately broken step, so only generate is run here.
      - name: Generate the documentation of the example project
        working-directory: examples/bookshop
        run: ../../mvnw -B -ntp stepdoc:generate

      - name: Check the generated files
        working-directory: examples/bookshop/target/stepdoc
        run: |
          grep -q "I add {int} copies of {string}" steps.md
          grep -q "<title>Bookshop steps</title>" steps.html

      - name: Upload the generated documentation
        uses: actions/upload-artifact@v7
        with:
          name: example-documentation
          path: examples/bookshop/target/stepdoc/

  # Single check to require in branch protection: it stays valid when jobs or the
  # JDK matrix change. A skipped job (branch name on a push) counts as passed.
  result:
    name: CI result
    if: always()
    needs: [branch-name, build, plugin-smoke-test]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          if [[ " $RESULTS " == *" failure "* || " $RESULTS " == *" cancelled "* ]]; then
            exit 1
          fi
